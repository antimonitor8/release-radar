<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Ishan’s Radar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <header class="top">
    <div class="bar">
      <h1>ISHAN’S RADAR</h1>
      <p id="status" class="status" aria-live="polite">loading…</p>
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="new" class="on">New</button>
      <button data-tab="saved">Saved <span id="savedCount"></span></button>
    </nav>
    <div id="chips" class="chips" aria-label="Filter by genre"></div>
  </header>

  <div id="ptr" class="ptr" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16.5 10a6.5 6.5 0 1 1-2-4.7"/><path d="M16.5 3v3.5H13"/></svg>
  </div>
  <main id="feed" class="feed"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=12"></script>
</body>
</html>
